spring:
  application:
    name: conversation
  # Relative to backend/ when launched through Gradle or IntelliJ.
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  http:
    client:
      connect-timeout: 5s
      read-timeout: 120s
  ai:
    openai:
      base-url: https://openrouter.ai/api
      api-key: ${OPENROUTER_API_KEY:}
      chat:
        options:
          model: ${OPENROUTER_MODEL:}

app:
  trajectory:
    enabled: ${TRAJECTORY_ENABLED:true}
    resource-prefix: trajectory
    threads: ${TRAJECTORY_THREADS:3}
    link-threshold: ${TRAJECTORY_LINK_THRESHOLD:0.8}
    max-active: 64
    max-responses-per-request: 32
    ttl: 24h
  llm:
    provider: openrouter
  chat:
    system-prompt: classpath:prompts/system.txt
  admin:
    # Prompt risk at or above this is shown as high risk on the admin page (0..1).
    risk-threshold: 0.5

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
