spring:
  application:
    name: conversation
  # Relative to backend/ when launched through Gradle or IntelliJ.
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  http:
    client:
      connect-timeout: 5s
      read-timeout: 120s
  ai:
    openai:
      base-url: https://openrouter.ai/api
      api-key: ${OPENROUTER_API_KEY:}
      chat:
        options:
          model: ${OPENROUTER_MODEL:}

app:
  llm:
    provider: openrouter
  chat:
    system-prompt: classpath:prompts/system.txt

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
